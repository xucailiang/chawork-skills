services:
  hub-api:
    build: .
    container_name: chawork-skills-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
      - ./config:/app/config:ro
    environment:
      - NODE_ENV=production
      - PORT=8010
      - HOST=0.0.0.0

  hub-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: chawork-skills-web
    restart: unless-stopped
    ports:
      - "8011:3000"
    volumes:
      - ./web/public/downloads:/app/public/downloads
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://host.docker.internal:8010
      - API_PROXY_TARGET=http://host.docker.internal:8010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hub-api
