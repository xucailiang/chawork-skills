services:
  hub-api:
    build: .
    container_name: chawork-skills-api
    restart: unless-stopped
    ports:
      - "8010:3100"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
      - ./config:/app/config:ro
    environment:
      - NODE_ENV=production
      - PORT=3100
      - HOST=0.0.0.0
      - OTA_ADMIN_TOKEN=${OTA_ADMIN_TOKEN:-}

  hub-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: chawork-skills-web
    restart: unless-stopped
    ports:
      - "8011:3000"
    volumes:
      - ./web/public/downloads:/app/public/downloads
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://hub-api:3100
      - API_PROXY_TARGET=http://hub-api:3100
    depends_on:
      - hub-api
